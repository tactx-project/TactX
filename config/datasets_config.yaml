  data_root: 'policy_learning/data/latent_data_new_processed'

  episode_val_split: true
  # Per-object val ids (front-half + back-half even stride, ~20% each object).
  val_episode_ids:
    circle:            [0, 6, 11, 17, 22, 28, 34, 39, 45, 46, 52, 57, 63, 68, 74, 80, 85, 91]
    cylinder:          [0, 6, 12, 18, 24, 30, 36, 42, 43, 48, 54, 59, 64, 69, 74, 80, 85]
    cylinder_vertical: [0, 6, 11, 17, 23, 28, 34, 35, 41, 46, 52, 58, 63, 69]
    ellipse:           [0, 6, 11, 17, 22, 28, 34, 39, 45, 46, 51, 56, 61, 66, 72, 77, 82, 87, 92]
    large_ball:        [0, 6, 11, 17, 22, 28, 33, 39, 40, 46, 51, 57, 62, 68, 73, 79]
    plane:             [0, 6, 12, 17, 23, 29, 35, 40, 46, 52, 53, 58, 64, 69, 74, 80, 85, 90, 95, 101, 106]
    plane_horizontal:  [0, 6, 11, 17, 22, 28, 34, 39, 45, 46, 52, 57, 63, 68, 74, 80, 85, 91]
