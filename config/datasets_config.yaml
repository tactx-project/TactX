    std:  [1576.587280, 1893.798340, 606.527344, 2767.648193, 663.345093, 1856.128418, 863.060547, 3104.303467, 2374.263916, 1000.755371, 3127.004883, 1633.794800, 2417.779785, 489.083435, 944.870911]

  flexitac_transforms:
    - 'normalize'
  flexitac_stats:
    mean: 0.064869
    std:  0.160324

  pairs:
    de:
      sensor_a: 'daimon'
      sensor_b: 'eflesh'
      root:    'de_pair'
      extra_transforms_a: ['rot180']
    ef:
      sensor_a: 'eflesh'
      sensor_b: 'flexi'
      root:    'ef_pair'
      extra_transforms_b: ['rot180']
    fd:
      sensor_a: 'flexi'
      sensor_b: 'daimon'
      root:    'fd_pair'
      extra_transforms_b: ['rot180']
